<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentHub Marketplace</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="logo">RentHub</div>
    <div class="search-bar">
      <input type="text" placeholder="Search items...">
      <button>Search</button>
    </div>
    <nav class="nav-links">
      <a href="#">Login</a>
      <a href="#">Post Item</a>
      <a href="#">My Account</a>
    </nav>
  </header>

  <!-- Sidebar + Main -->
  <div class="layout">
    <aside class="sidebar">
      <h3>Categories</h3>
      <ul>
        <li><a href="#">Electronics</a></li>
        <li><a href="#">Vehicles</a></li>
        <li><a href="#">Furniture</a></li>
        <li><a href="#">Sports</a></li>
        <li><a href="#">Others</a></li>
      </ul>
    </aside>

    <main class="products">
      <div class="product-card">
        <img src="https://via.placeholder.com/200x150" alt="Camera">
        <h4>DSLR Camera</h4>
        <p>Rent this professional DSLR camera for your events.</p>
        <button class="rent-btn" onclick="rentItem('DSLR Camera')">Rent Now</button>
      </div>

      <div class="product-card">
        <img src="https://via.placeholder.com/200x150" alt="Bike">
        <h4>Mountain Bike</h4>
        <p>Perfect for weekend adventures.</p>
        <button class="rent-btn" onclick="rentItem('Mountain Bike')">Rent Now</button>
      </div>
    </main>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 RentHub. Inspired by eBay design.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
